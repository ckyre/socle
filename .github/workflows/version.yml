# Tests à chaque envoi ; à chaque étiquette vX.Y.Z, publication d'une version GitHub avec :
# - socle-X.Y.Z-py3-none-any.whl (paquet Python)
# - socle-X.Y.Z.tgz (kit CSS, paquet npm)
# - SHA256SUMS (empreintes à reporter dans les applications)
name: Tests et version

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances de test
        run: pip install -e "python[serve,transfert]" -r python/requirements-test.txt
      - name: Tests
        env:
          TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q python/tests

  css:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérification du CSS (Tailwind 4)
        run: |
          npm install --no-save --no-package-lock tailwindcss@4.3.3 @tailwindcss/node@4.3.3
          node scripts/verifier-css.mjs
      - name: Vérification du JS (notifications push)
        run: for f in js/*.js scripts/*.mjs; do node --check "$f"; done

  version:
    needs: [tests, css]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cohérence des numéros de version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('python/src/socle/__init__.py').read())[1])")
          js=$(node -p "require('./package.json').version")
          echo "étiquette=$tag python=$py css=$js"
          [ "$tag" = "$py" ] && [ "$tag" = "$js" ]
      - name: Construction
        run: |
          pip install build==1.2.2.post1
          python -m build --wheel --outdir dist python
          npm pack --pack-destination dist
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
